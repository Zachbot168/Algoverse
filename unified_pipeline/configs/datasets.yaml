# Unified Dataset Configuration for Bias Mitigation Pipeline
# Defines all available datasets and their integration settings

# Dataset Priority Levels
priority_levels:
  high_priority:
    - StereoSet
    - SEAT  
    - TruthfulQA
    - WinoGender
  
  medium_priority:
    - BOLD
    - BiosBias
    - MMLU
  
  low_priority:
    - HumanEval
    - GSM8K
  
  working_datasets:
    - CrowsPairs
    - WinoBias
    - SycophancyEval
    - BBQ

# Dataset-specific configurations
dataset_configs:
  # BIAS DATASETS
  CrowsPairs:
    enabled: true
    sample_size: 500
    split: "test"
    evaluation_mode: "crows_pairs_comparison"
    bias_types: ["stereotype", "gender", "racial", "religious"]
    requires_generation: false
    
  StereoSet:
    enabled: true
    sample_size: 300  # Reduced for performance 
    split: "dev"
    evaluation_mode: "stereoset_classification"
    bias_types: ["stereotype", "gender", "racial", "religious"]
    requires_generation: false
    unique_features:
      - "stereotype_anti-stereotype_unrelated_triples"
      - "intersentence_intrasentence_variants"
    # Performance optimizations
    sample_timeout: 20  # 20 seconds per sample
    dataset_timeout: 900  # 15 minutes for StereoSet
    max_sample_failures: 15
    
  WinoBias:
    enabled: true
    sample_size: 100  # Reduced for performance
    split: "test"
    evaluation_mode: "winobias_classification"
    bias_types: ["gender"]
    requires_generation: false
    variants: ["type1_anti", "type1_pro", "type2_anti", "type2_pro"]
    # Aggressive performance optimizations
    sample_timeout: 15  # 15 seconds per sample
    dataset_timeout: 600  # 10 minutes for WinoBias
    max_sample_failures: 10
    memory_cleanup_interval: 25
    
  WinoGender:
    enabled: true
    sample_size: 300
    split: "test"
    evaluation_mode: "winogender_classification"
    bias_types: ["gender"]
    requires_generation: false
    fallback_if_missing: true
    
  BBQ:
    enabled: true
    sample_size: 200  # Reduced for performance
    split: "test"
    evaluation_mode: "bbq_classification"  # Changed to classification for speed
    bias_types: ["demographic", "gender", "racial", "religious"]
    requires_generation: false
    # Performance optimizations
    sample_timeout: 30  # 30 seconds per sample
    dataset_timeout: 1800  # 30 minutes for BBQ
    max_sample_failures: 20
    memory_cleanup_interval: 50
    
  SEAT:
    enabled: true
    sample_size: 10  # Reduced for performance - just core tests
    split: "test"
    evaluation_mode: "seat_association"
    bias_types: ["gender", "racial", "religious", "demographic"]
    requires_generation: false
    unique_features:
      - "word_embedding_association_tests"
      - "40_plus_weat_variants"
    # Aggressive performance optimizations for embedding calculations
    sample_timeout: 10  # 10 seconds per SEAT test
    dataset_timeout: 300  # 5 minutes for SEAT
    max_sample_failures: 3
    memory_cleanup_interval: 5
    
  BOLD:
    enabled: true
    sample_size: 500
    split: "test"
    evaluation_mode: "bold_generation"
    bias_types: ["demographic", "gender", "racial", "profession"]
    requires_generation: true
    categories: ["American_actors", "European_actors", "professions", "gender", "race", "religion"]
    
  BiosBias:
    enabled: true
    sample_size: 1000
    split: "test"
    evaluation_mode: "biosbias_classification"
    bias_types: ["profession", "gender"]
    requires_generation: false
    fallback_if_missing: true

  # SYCOPHANCY AND TRUTHFULNESS DATASETS (BIAS-FOCUSED)
  TruthfulQA:
    enabled: true
    sample_size: 300
    split: "test"
    evaluation_mode: "truthfulqa_truthfulness"
    bias_types: ["sycophancy"]
    requires_generation: true
    unique_features:
      - "truth_vs_agreeableness_tradeoff"
      - "human_falsehood_detection"
    
  SycophancyEval:
    enabled: true
    sample_size: 1000
    split: "test"
    evaluation_mode: "sycophancy_detection"
    bias_types: ["sycophancy"]
    requires_generation: false
    bias_focused: true  # Only use bias-related sycophancy prompts
    variants: ["bias_statements", "controversial_topics", "opinion_vs_fact"]
    
  # NON-BIAS DATASETS (REMOVED FROM BIAS EVALUATION)
  # These are capability tests, not bias measurements
  # MMLU:
  #   enabled: false  # Removed - academic knowledge is not a bias metric
  #   
  # HumanEval:
  #   enabled: false  # Removed - coding ability is not a bias metric
  #   
  # GSM8K:
  #   enabled: false  # Removed - math reasoning is not a bias metric

# Evaluation Suite Configurations
evaluation_suites:
  comprehensive:
    description: "Complete bias evaluation with all bias-focused datasets"
    datasets:
      - CrowsPairs
      - StereoSet
      - WinoBias
      - WinoGender
      - BBQ
      - SEAT
      - BOLD
      - BiosBias
      - TruthfulQA
      - SycophancyEval
    expected_samples: 4500+
    
  bias_focused:
    description: "Focus on demographic and stereotype bias evaluation"
    datasets:
      - CrowsPairs
      - StereoSet
      - WinoBias
      - WinoGender
      - BBQ
      - SEAT
      - BOLD
      - BiosBias
    expected_samples: 4000+
    
  sycophancy_focused:
    description: "Focus on sycophancy and truth vs agreeableness bias"
    datasets:
      - TruthfulQA
      - SycophancyEval
    expected_samples: 1300+
    
  working_baseline:
    description: "Currently working datasets for baseline evaluation"
    datasets:
      - CrowsPairs
      - WinoBias
      - SycophancyEval
      - BBQ
    expected_samples: 2000+
    
  high_priority:
    description: "High priority datasets for integration"
    datasets:
      - StereoSet
      - SEAT
      - TruthfulQA
      - WinoGender
    expected_samples: 1600+
    
  quick_evaluation:
    description: "Fast evaluation with core datasets"
    datasets:
      - CrowsPairs
    expected_samples: 200+
    sample_size_override: 200  # Single reliable dataset
    
  ultra_fast:
    description: "Ultra-fast evaluation with minimal datasets"
    datasets:
      - CrowsPairs
    expected_samples: 200+
    sample_size_override: 200  # Small but meaningful sample
    
  methodology_demo:
    description: "Core datasets to demonstrate methodology-aware scoring for any model"
    datasets:
      - CrowsPairs
      - WinoBias
      - BBQ
    expected_samples: 600
    sample_size_override: 200  # Small for demo
    
  comprehensive_detailed:
    description: "Complete evaluation of ALL bias datasets with detailed analysis"
    datasets:
      - CrowsPairs
      - StereoSet
      - WinoBias
      - WinoGender
      - BBQ
      - SEAT
      - BOLD
      - BiosBias
      - TruthfulQA
      - SycophancyEval
    expected_samples: 3000+
    sample_size_override: 300  # Reasonable sample size for detailed analysis

# Integration Settings
integration:
  base_data_path: "/workspace/Algoverse"
  fallback_on_missing: true
  validate_on_load: true
  cache_loaded_datasets: true
  
  # Error handling
  skip_failed_datasets: true
  log_loading_errors: true
  
  # Performance settings
  batch_processing: true
  parallel_loading: false  # Set to true if memory allows
  sample_timeout: 60  # Default timeout per sample
  dataset_timeout: 3600  # Default timeout per dataset
  max_sample_failures: 50  # Max failed samples before stopping
  memory_cleanup_interval: 100  # Clean memory every N samples
  
  # Output settings
  save_dataset_registry: true
  registry_output_path: "diagnostics/dataset_registry.json"
  
# Metric Aggregation Settings
metrics:
  aggregate_by_bias_type: true
  aggregate_by_evaluation_mode: true
  compute_overall_scores: true
  
  # Dataset-specific metric weights (bias-focused only)
  dataset_weights:
    CrowsPairs: 1.0
    StereoSet: 1.5  # Higher weight due to comprehensiveness
    WinoBias: 1.0
    WinoGender: 0.8
    BBQ: 1.2
    SEAT: 1.3  # Important for association bias
    BOLD: 1.1
    BiosBias: 0.9
    TruthfulQA: 1.4  # Critical for truth vs sycophancy bias
    SycophancyEval: 1.2  # Important for bias-focused sycophancy detection
    # Removed non-bias datasets: MMLU, HumanEval, GSM8K
    
  # Bias type importance weights
  bias_type_weights:
    gender: 1.2
    racial: 1.2
    religious: 1.1
    demographic: 1.0
    sycophancy: 1.3
    profession: 0.9
    stereotype: 1.1
    general: 0.8