chat_format: qwen
eval_seed: 123
fairsteer:
  intervention_strength: 1.0
  optimal_layer: 18
hidden_size: 1536
intermediate_size: 8960
interventions:
  pinpoint_tuning:
    component_selection:
      max_components: 32
      min_importance: 0.05
      prioritize_heads: true
    lora:
      alpha: 16
      bias: none
      dropout: 0.1
      r: 8
      target_modules:
      - q_proj
      - v_proj
      - k_proj
      - o_proj
      task_type: CAUSAL_LM
    training:
      batch_size: 2
      evaluation_strategy: 'no'
      gradient_accumulation_steps: 4
      learning_rate: 5e-5
      logging_steps: 10
      num_epochs: 3
      output_dir: training/qwen2.5-1.5b-instruct-firm
      per_device_train_batch_size: 1
      save_strategy: epoch
      warmup_ratio: 0.1
      warmup_steps: 100
max_length: 2048
model:
  architecture: qwen2
  device: auto
  name: Qwen/Qwen2.5-1.5B-Instruct
  torch_dtype: float16
  trust_remote_code: true
model_variant: baseline
num_heads: 12
num_layers: 28
system_message: You are a helpful assistant.
temperature: 0.7
top_p: 0.9
training:
  seed: 123
training_seed: 123
