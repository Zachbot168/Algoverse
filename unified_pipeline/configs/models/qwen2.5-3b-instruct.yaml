model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  architecture: qwen2
  device: auto
  torch_dtype: float16
  trust_remote_code: true

model_variant: baseline

# Model architecture info for bias mitigation
num_layers: 36
num_heads: 16
hidden_size: 2048
intermediate_size: 11008

# FairSteer configuration
fairsteer:
  optimal_layer: 24  # Middle-upper layer for 36-layer model
  intervention_strength: 1.0

# Model-specific settings
max_length: 2048
temperature: 0.7
top_p: 0.9

# Chat template settings  
chat_format: "qwen"
system_message: "You are a helpful assistant."

# FIRM interventions configuration
interventions:
  pinpoint_tuning:
    component_selection:
      max_components: 32
      min_importance: 0.05
      prioritize_heads: true
    lora:
      r: 8
      alpha: 16
      dropout: 0.1
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      bias: "none"
      task_type: "CAUSAL_LM"
    training:
      output_dir: "training/qwen2.5-3b-instruct-firm"
      learning_rate: 5e-5
      num_epochs: 3
      batch_size: 2
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 4
      warmup_steps: 100
      warmup_ratio: 0.1
      logging_steps: 10
      save_strategy: "epoch"
      evaluation_strategy: "no"