auth:
  license_acceptance_required: true
  requires_hf_token: true
data:
  bias_bench_path: ../datasets/bias-bench
  crows_pairs_path: ../datasets/crows-pairs
  diagnostic_path: data/gemma_diagnostic.jsonl
  sycophancy_path: ../sycophancy-interpretability/evaluation/datasets/sycophancy_eval
  training_data: ../sycophancy-interpretability/prepare_training_data
  winobias_path: ../datasets/winobias
diagnostic:
  layer_range:
  - 10
  - 17
  save_activations: true
  use_attention_analysis: true
  use_mlp_probing: true
eval_seed: 42
evaluation:
  batch_size: 4
  datasets:
  - sycophancy_eval
  - bias_bench
  - winobias
  - crows_pairs
  max_samples: 1500
  output_dir: results/gemma-2-2b-it
gemma_settings:
  max_sequence_length: 2048
  system_prompt: You are a helpful, harmless, and honest assistant.
  temperature: 0.7
  use_chat_template: true
interventions:
  enable_pinpoint_tuning: true
  enable_steering: true
  pinpoint_tuning:
    component_selection:
      max_components: 32
      min_importance: 0.05
      prioritize_heads: true
    lora:
      alpha: 32
      dropout: 0.1
      r: 16
      target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    training:
      batch_size: 2
      gradient_accumulation_steps: 8
      learning_rate: 5e-5
      logging_steps: 50
      num_epochs: 2
      output_dir: training/gemma-2-2b-it
      save_strategy: epoch
      warmup_ratio: 0.1
  steering:
    bad:
      accuracy_threshold: 0.65
      layers_to_probe:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 17
      training_data_size: 3000
    das:
      apply_scaling: true
      hook_layers:
      - 14
      max_intervention: 2.0
      threshold: 0.5
    dsv:
      bias_categories:
      - gender
      - race
      - religion
      - sycophancy
      magnitude_scale: 1.2
      num_contrastive_pairs: 1000
interventions_enabled: false
model:
  architecture: gemma
  device: auto
  model_type: decoder
  name: google/gemma-2-2b-it
  torch_dtype: float16
  trust_remote_code: false
model_variant: baseline
training:
  seed: 42
training_seed: 42
